# Publishes the static site in docs/ (index.html at the site root).
# GitHub will only offer "GitHub Actions" as the Pages source after this
# file is on the repository's default branch (main). Until then, Settings,
# Pages, Deploy from a branch, folder /docs, also serves docs/index.html.
name: GitHub Pages

on:
  push:
    branches:
      - main
      - manga-ink-redesign
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
